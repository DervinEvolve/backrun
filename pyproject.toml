[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backrun"
version = "0.0.1"
description = "A watercolor simulator and a painter that learns to use it"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]
train = ["torch>=2.3"]

[project.scripts]
backrun = "backrun.cli:main"

[tool.setuptools.packages.find]
include = ["backrun*", "train*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
