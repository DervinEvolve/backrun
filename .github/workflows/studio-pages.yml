# Publishes the studio to GitHub Pages whenever main changes under studio/.
# Pages has to be enabled once in the repository settings (Settings, Pages, Source: GitHub Actions).
name: studio-pages

on:
  push:
    branches: [main]
    paths: ["studio/**", ".github/workflows/studio-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
        working-directory: studio
      # relative base, so the build works at https://<user>.github.io/<repo>/ and at any other path
      - run: npx vite build --base ./
        working-directory: studio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: studio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
